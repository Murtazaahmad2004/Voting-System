<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin_dashboard.css">
    <title>Admin DashBoard(Admin)</title>
</head>
<style>
    :root{
  --ink:#122024;
  --ink-soft:#4b5d61;
  --paper:#f6f4ef;
  --card:#ffffff;
  --line:#e2ddd2;
  --teal:#1f6f66;
  --teal-deep:#123c37;
  --amber:#c98a2c;
}

*{ box-sizing:border-box; }

html, body{
  margin:0;
  padding:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Segoe UI", ui-sans-serif, system-ui, -apple-system, sans-serif;
  min-height:100vh;
  overflow: hidden;
}

/* ---- Top navbar ---- */
.navbar{
  background:var(--teal-deep);
  color:#fdfaf3;
  padding:20px 32px;
  margin:0 0 0 220px;   /* offset for a left sidebar; set to 0 if no sidebar */
  box-shadow:0 2px 10px rgba(18,32,36,0.15);
}
.navbar h1{
  margin:0;
  font-size:20px;
  font-weight:700;
  letter-spacing:-0.2px;
}

/* ---- Dashboard content area ---- */
.dashboard-home{
  margin:0 0 0 220px;   /* offset for a left sidebar; set to 0 if no sidebar */
  min-height:calc(100vh - 130px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:48px 24px;
}

/* ---- Welcome card ---- */
.welcome-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:0 20px 50px -25px rgba(18,32,36,0.25);
  padding:48px 44px;
  max-width:480px;
  width:100%;
  text-align:center;
}

.welcome-icon{
  width:68px;
  height:68px;
  margin:0 auto 20px;
  border-radius:50%;
  background:#e8f2ef;
  color:var(--teal-deep);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
}

.welcome-card h1{
  margin:0 0 12px;
  font-size:24px;
  font-weight:700;
  letter-spacing:-0.3px;
  color:var(--ink);
}

.welcome-card p{
  margin:0 0 28px;
  font-size:14px;
  line-height:1.6;
  color:var(--ink-soft);
}

/* ---- Quick stats row ---- */
.quick-stats{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
}

.stat-pill{
  flex:1;
  min-width:110px;
  background:#f1efe6;
  border-radius:14px;
  padding:14px 12px;
  display:flex;
  flex-direction:column;
  gap:4px;
}

.stat-num{
  font-size:20px;
  font-weight:700;
  color:var(--teal-deep);
}

.stat-label{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.5px;
  color:var(--ink-soft);
  font-weight:600;
}

/* ---- Footer ---- */
.footer{
  margin:0 0 0 220px;   /* offset for a left sidebar; set to 0 if no sidebar */
  padding:18px 24px;
  text-align:center;
  border-top:1px solid var(--line);
  background:var(--card);
}
.footer p{
  margin:0;
  font-size:12px;
  color:var(--ink-soft);
}

/* ---- Responsive: collapse sidebar offset on small screens ---- */
@media (max-width: 768px){
  .navbar,
  .dashboard-home,
  .footer{
    margin-left:0;
  }
  .welcome-card{
    padding:36px 26px;
  }
  .navbar h1{
    text-align: center;
  }
}
</style>
<body>
    {% include '/admin/admin_sidebar.html' %}

    <div class="navbar">
        <h1>Admin Page</h1>
    </div>

    <div class="dashboard-home">

        <div class="welcome-card">

            <div class="welcome-icon">
                <i class="fas fa-user-shield"></i>
            </div>

            <h1>Welcome, Admin</h1>

            <p>
                Manage your Online Voting System from one place.
            </p>

            <div class="quick-stats">
                <div class="stat-pill">
                    <span class="stat-num">--</span>
                    <span class="stat-label">Candidates</span>
                </div>
                <div class="stat-pill">
                    <span class="stat-num">--</span>
                    <span class="stat-label">Voters</span>
                </div>
                <div class="stat-pill">
                    <span class="stat-num">--</span>
                    <span class="stat-label">Votes Cast</span>
                </div>
            </div>

        </div>

    </div>

    <div class="footer">
        <p>&copy; 2026 Voting System. All rights reserved.</p>
    </div>
</body>
</html>
