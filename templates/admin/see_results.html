<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <title>Voting Results(Admin)</title>
</head>
<style>
  :root{
    --ink:#122024;
    --ink-soft:#4b5d61;
    --paper:#f6f4ef;
    --card:#ffffff;
    --line:#e2ddd2;
    --teal:#1f6f66;
    --teal-deep:#123c37;
    --amber:#c98a2c;
    --sidebar-w:220px;
  }

  *{ box-sizing:border-box; }

  html, body{
    margin:0;
    padding:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Segoe UI", ui-sans-serif, system-ui, -apple-system, sans-serif;
  }

  body.has-sidebar{
    margin-left:var(--sidebar-w);
    padding-top:68px;
    padding-bottom:52px;
  }

  /* ---- Top navbar ---- */
  .navbar{
    position:fixed;
    top:0;
    left:var(--sidebar-w);
    right:0;
    z-index:50;
    background:var(--teal-deep);
    color:#fdfaf3;
    padding:20px 32px;
    box-shadow:0 2px 10px rgba(18,32,36,0.15);
  }
  .navbar h1{
    margin:0;
    font-size:20px;
    font-weight:700;
    letter-spacing:-0.2px;
  }

  /* ---- Page content ---- */
  .page-content{
    padding:32px 32px 8px;
  }

  .section-title{
    font-size:20px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 24px;
    text-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .section-title::before{
    content:"\1F5F3";
    font-size:18px;
  }

  /* ---- Results table card ---- */
  .table-wrapper{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:0 14px 30px -22px rgba(18,32,36,0.2);
    overflow-x:auto;
    max-width:760px;
    margin:0 auto 32px;
  }

  table.results-table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
    min-width:480px;
  }

  table.results-table thead th{
    background:var(--teal-deep);
    color:#fdfaf3;
    text-align:left;
    padding:14px 18px;
    font-size:11.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.5px;
    white-space:nowrap;
  }
  table.results-table thead th:first-child{ border-top-left-radius:16px; }
  table.results-table thead th:last-child{ border-top-right-radius:16px; }

  table.results-table tbody td{
    padding:13px 18px;
    border-bottom:1px solid var(--line);
    color:var(--ink);
    vertical-align:middle;
  }
  table.results-table tbody tr:last-child td{
    border-bottom:none;
  }
  table.results-table tbody tr:nth-child(even){
    background:#faf9f5;
  }
  table.results-table tbody tr:hover{
    background:#f0ece0;
  }

  table.results-table tbody td:last-child{
    font-weight:700;
    color:var(--teal-deep);
  }

  table.results-table tbody td[colspan]{
    text-align:center;
    color:var(--ink-soft);
    padding:28px 16px;
    font-style:italic;
  }

  /* ---- Footer ---- */
  .footer{
    position:fixed;
    bottom:0;
    left:var(--sidebar-w);
    right:0;
    z-index:50;
    padding:14px 24px;
    text-align:center;
    border-top:1px solid var(--line);
    background:var(--card);
  }
  .footer p{
    margin:0;
    font-size:12px;
    color:var(--ink-soft);
  }

  /* ---- Responsive ---- */
  @media (max-width: 768px){
    body.has-sidebar{
      margin-left:0;
    }
    .navbar, .footer{
      left:0;
    }
    .navbar h1 {
        text-align: center;
    }
    .page-content{
      padding:24px 18px 8px;
    }
  }
</style>
<body class="has-sidebar">

    {% include '/admin/admin_sidebar.html' %}

    <div class="navbar">
        <h1>Result Page</h1>
    </div>

    <div class="page-content">

        <h2 class="section-title">Voting Results</h2>

        <div class="table-wrapper">
            <table class="results-table">
                <thead>
                    <tr>
                        <th>Party Name</th>
                        <th>Candidate Name</th>
                        <th>Total Votes</th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in results %}
                    <tr>
                        <td>{{ row.party_name }}</td>
                        <td>{{ row.candidate_name }}</td>
                        <td>{{ row.total_votes }}</td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="3">No results available yet.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

    </div>

    <div class="footer">
        <p>&copy; 2026 Voting System. All rights reserved.</p>
    </div>
</body>
</html>
