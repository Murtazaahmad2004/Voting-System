<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="{{ url_for('static', filename='script/main.js') }}"></script>
  <title>Admin Sidebar</title>
</head>
<style>
  :root{
  --ink:#122024;
  --ink-soft:#4b5d61;
  --paper:#f6f4ef;
  --card:#ffffff;
  --line:#e2ddd2;
  --teal:#1f6f66;
  --teal-deep:#123c37;
  --amber:#c98a2c;
  --sidebar-w:220px;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:"Segoe UI", ui-sans-serif, system-ui, -apple-system, sans-serif;
  background:var(--paper);
}

/* ---- Sidebar ---- */
.sidebar{
  position:fixed;
  top:0;
  left:0;
  width:var(--sidebar-w);
  height:100vh;
  width: 230px;
  background:var(--teal-deep);
  color:#fdfaf3;
  display:flex;
  flex-direction:column;
  z-index:100;
  box-shadow:2px 0 12px rgba(18,32,36,0.15);
  transition:transform .25s ease;
}

.sidebar-brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:22px 22px 18px;
  font-size:15px;
  font-weight:700;
  letter-spacing:-0.2px;
  border-bottom:1px solid rgba(253,250,243,0.12);
}
.sidebar-brand i{
  color:var(--amber);
  font-size:18px;
}

.sidebar-links{
  flex:1;
  padding:14px 10px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:2px;
}

.sidebar a{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 14px;
  color:#d8e8e4;
  text-decoration:none;
  font-size:13.5px;
  font-weight:500;
  border-radius:10px;
  transition:background .15s ease, color .15s ease;
}
.sidebar a i{
  width:18px;
  text-align:center;
  font-size:14px;
  color:#a9c9c2;
  transition:color .15s ease;
}

.sidebar a:hover{
  background:rgba(253,250,243,0.08);
  color:#fdfaf3;
}
.sidebar a:hover i{
  color:var(--amber);
}

.sidebar a.active{
  background:var(--amber);
  color:#241705;
}
.sidebar a.active i{
  color:#241705;
}

.sidebar-footer{
  padding:14px 10px 18px;
  border-top:1px solid rgba(253,250,243,0.12);
}

.logout-link{
  color:#f3d4c7 !important;
}
.logout-link i{
  color:#e79a7c !important;
}
.logout-link:hover{
  background:rgba(231,60,60,0.15) !important;
  color:#ffe3da !important;
}

/* ---- Toggle button (mobile) ---- */
.toggle-btn{
  display:none;
  position:fixed;
  top:14px;
  left:14px;
  width:40px;
  height:40px;
  background:var(--teal-deep);
  color:#fdfaf3;
  border-radius:10px;
  align-items:center;
  justify-content:center;
  font-size:18px;
  cursor:pointer;
  z-index:110;
  box-shadow:0 4px 12px rgba(18,32,36,0.25);
}

/* ---- Push page content beside the sidebar ---- */
/* Add this class to your <body> tag on pages that include this sidebar */
body.has-sidebar{
  margin-left:var(--sidebar-w);
}

/* ---- Responsive ---- */
@media (max-width: 768px){
  .sidebar{
    transform:translateX(-100%);
  }
  .sidebar.collapsed{
    transform:translateX(0);
  }
  .toggle-btn{
    display:flex;
  }
  body.has-sidebar{
    margin-left:0;
  }
  .sidebar-brand span {
    margin-left: 10px;
  }
}
</style>
<body>
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">

    <div class="sidebar-brand">
      <i class="fa-solid fa-check-to-slot"></i>
      <span>Voting System</span>
    </div>

    <div class="sidebar-links">
      <a href="/admin/admin_page"><i class="fa-solid fa-house"></i> Home Page</a>
      <a href="/admin/dashboard"><i class="fa-solid fa-chart-line"></i> DashBoard</a>
      <a href="/admin/voter_list_page"><i class="fa-solid fa-users-gear"></i> Role Management</a>
      <a href="/admin/candidate_list_page"><i class="fa-solid fa-user-tie"></i> Candidate Management</a>
      <a href="/admin/see_results"><i class="fa-solid fa-poll"></i> Voting Results</a>
      <a href="/admin/create_election"><i class="fas fa-plus-circle"></i> Create New Election</a>
      <a href="/admin/elections"><i class="fas fa-list"></i> Elections</a>
      <a href="/admin/notification_alert"><i class="fa-solid fa-bell"></i> Notifications</a>
    </div>

    <div class="sidebar-footer">
      <a href="/login" class="logout-link"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>

  </div>

  <!-- Toggle Button -->
  <div class="toggle-btn" onclick="toggleSidebar()">☰</div>

  <script>
    // Fallback so the sidebar toggles even if main.js doesn't define this yet
    if (typeof toggleSidebar !== 'function') {
      function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('collapsed');
        document.body.classList.toggle('sidebar-collapsed');
      }
    }
  </script>
</body>
</html>
